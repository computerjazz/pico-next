name: build-image
on:
  workflow_dispatch:
  push:
    branches: [ci-dryrun]   # not main, so normal pushes are unaffected

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native arm64, free for public repos
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/arm64
          push: true
          tags: ghcr.io/<your-github-user>/<repo>:test-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_VIRTUAL_GROUP_ID=${{ vars.NEXT_PUBLIC_VIRTUAL_GROUP_ID }}
          
          cache-from: type=gha
          cache-to: type=gha,mode=max